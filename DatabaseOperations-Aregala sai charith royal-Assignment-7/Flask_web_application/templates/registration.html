<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Registration</title>
  <style>
    body { background: #f4f7fb; color: #1f2937; font-family: Arial, sans-serif; margin: 0; }
    main { background: #fff; border-radius: 12px; box-shadow: 0 8px 24px #1f29371a; margin: 5rem auto; max-width: 430px; padding: 2rem; }
    h1 { color: #1d4ed8; margin-top: 0; }
    label { display: block; font-weight: bold; margin: 1rem 0 .4rem; }
    input { border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; padding: .7rem; width: 100%; }
    button { background: #1d4ed8; border: 0; border-radius: 6px; color: #fff; cursor: pointer; font-size: 1rem; margin-top: 1.5rem; padding: .75rem 1rem; width: 100%; }
    button:hover { background: #1e40af; }
    .error { background: #fee2e2; border-radius: 6px; color: #991b1b; padding: .75rem; }
  </style>
</head>
<body>
  <main>
    <h1>User Registration</h1>
    <p>Please enter your details below.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" value="{{ form_data.get('name', '') }}" required>
      <label for="city">City</label>
      <input id="city" name="city" type="text" value="{{ form_data.get('city', '') }}" required>
      <label for="phone">Phone Number</label>
      <input id="phone" name="phone" type="tel" value="{{ form_data.get('phone', '') }}" required>
      <button type="submit">Register</button>
    </form>
  </main>
</body>
</html>
